<VirtualHost *:80>
    ServerName preprod.api.soluval.fr
    DocumentRoot /var/www/api-soluval/public
    DirectoryIndex index.php

    <Directory /var/www/api-soluval/public>
        AllowOverride All
        Require all granted

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>

        FallbackResource /index.php
    </Directory>

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    ErrorLog /var/log/apache2/api.soluval_error.log
    CustomLog /var/log/apache2/api.soluval_access.log combined
</VirtualHost>
