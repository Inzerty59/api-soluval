services:
  db:
    image: mysql:8.0
    container_name: db_api-soluval
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - dev

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin_api-soluval
    depends_on:
      - db
    ports:
      - 8090:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - dev

  www:
    build: .
    container_name: www_api-soluval
    ports:
      - "9000:80"
    volumes:
      - ./vhosts:/etc/apache2/sites-enabled
      - ./:/var/www/api-soluval
    networks:
      - dev

networks:
  dev:

volumes:
  db-data:
