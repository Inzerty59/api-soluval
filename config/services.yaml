services:
    # Configuration par défaut pour les services
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Service OpistoDataFetcher
    App\Service\OpistoDataFetcher:
        arguments:
            $client: '@http_client'
            $authService: '@App\Service\AuthenticationService'
            $apiUrl: '%env(AUTH_URL_API)%' # Injection de la variable d'environnement

    # Service AuthenticationService (déjà défini correctement)
    App\Service\AuthenticationService:
        arguments:
            $client: '@http_client'
            $cache: '@cache.app'


    App\Service\FranceCasse\SftpCheckerService:
        arguments:
            $host: '%env(SFTP_HOST)%'
            $username: '%env(SFTP_USER)%'
            $password: '%env(SFTP_PASS)%'
            $remotePath: '%env(SFTP_PATH)%'


    # Autres services explicites
    App\Service\SiretVerificationService:
        arguments:
            $httpClient: '@http_client'
            $apiKey: '%insee_api_key%'
            $logger: '@logger'

    App\Service\OpistoStockChecker:
        arguments:
            $authUrlApi: '%env(AUTH_URL_API)%'
            $logger: '@logger'

    App\Service\QuotaService:
        arguments:
            $minuteLimiter: '@limiter.api_minute'
            $hourLimiter: '@limiter.api_hour'
            $dayLimiter: '@limiter.api_day'
            
    App\Service\Ovoko\CheckCarService:
        arguments:
            $httpClient: '@http_client'
            $params: '@parameter_bag'

    App\Twig\AppExtension:
        tags: ['twig.extension']

    App\Twig\CartExtension:
        arguments:
            $cartController: '@App\Controller\Shop\CartController'
            $sessionFactory: '@session.factory'
        tags:
            - { name: twig.extension }

    App\Form\DeliveryAdressType:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'

    App\Form\BillingAdressType:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'

    App\EventListener\RateLimiterListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }

    App\Command\ExportOvokoCommand:
        tags: ['console.command']

    App\Repository\OvokoExportRepository:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    App\Controller\CallbackController:
        tags: ['controller.service_arguments']

    App\Service\StockSyncService:
        arguments:
            $opistoApi: '@App\Service\OpistoApiService'
            $ovokoApi: '@App\Service\OvokoApiService'
            $logger: '@logger'

    App\Service\Ovoko\DeletePartService: ~
    App\Service\Ovoko\OrderSyncService: ~
    App\Service\Ovoko\OrderPaymentService: ~

    App\Command\StockSyncCommand:
        arguments:
            $logger: '@logger'

parameters:
    stripe_secret_key: '%env(STRIPE_SECRET_KEY)%'
    stripe_public_key: '%env(STRIPE_PUBLIC_KEY)%'
    insee_api_key: '%env(INSEE_API_KEY)%'
    OVOKO_API_USERNAME: '%env(OVOKO_API_USERNAME)%'
    OVOKO_API_PASSWORD: '%env(OVOKO_API_PASSWORD)%'
    OVOKO_API_USER_TOKEN: '%env(OVOKO_API_USER_TOKEN)%'
    OVOKO_API_URL_BRAND: '%env(OVOKO_API_URL_BRAND)%'
    OVOKO_API_URL_MODEL: '%env(OVOKO_API_URL_MODEL)%'
    OVOKO_API_URL_IMPORT_CAR: '%env(OVOKO_API_URL_IMPORT_CAR)%'
    OVOKO_API_URL_IMPORT_PART: '%env(OVOKO_API_URL_IMPORT_PART)%'
    OVOKO_API_URL_DELETE_PART: '%env(OVOKO_API_URL_DELETE_PART)%'
    CALLBACK_HEADER_NAME: '%env(CALLBACK_HEADER_NAME)%'
    CALLBACK_HEADER_VALUE: '%env(CALLBACK_HEADER_VALUE)%'
